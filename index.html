<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Sky Home Supplies</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0D1117;--card:#161B22;--border:#21262D;--gold:#F0A500;--gold2:#FDD96A;--green:#3FB950;--red:#F85149;--blue:#58A6FF;--orange:#F97316;--muted:#8B949E;--text:#E6EDF3;--r:10px;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;font-size:15px;min-height:100vh;}
.nav{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:100;}
.nav-brand{color:var(--gold);font-weight:700;font-size:15px;padding:12px 0;}
.nav-links{display:flex;gap:4px;flex-wrap:wrap;padding:6px 0;}
.nav-links button{color:var(--muted);background:transparent;border:none;padding:7px 11px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit;}
.nav-links button.active,.nav-links button:hover{background:rgba(240,165,0,0.12);color:var(--gold);}
.con{max-width:960px;margin:0 auto;padding:20px 16px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px;}
.ctitle{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;font-family:monospace;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:18px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;text-align:center;border-left:3px solid var(--gold);}
.stat-v{font-size:20px;font-weight:700;color:var(--gold);font-family:monospace;}
.stat-l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:3px;}
.fg{margin-bottom:12px;}
label{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:4px;font-family:monospace;}
input,select,textarea{width:100%;background:#0D1117;border:1px solid var(--border);border-radius:6px;padding:9px 11px;color:var(--text);font-size:13px;outline:none;font-family:inherit;}
input:focus,select:focus{border-color:var(--gold);}
select option{background:#161B22;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:9px 16px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;white-space:nowrap;}
.btn-gold{background:var(--gold);color:#000;}.btn-gold:hover{background:var(--gold2);}
.btn-green{background:var(--green);color:#000;}.btn-green:hover{opacity:.85;}
.btn-red{background:var(--red);color:#fff;}
.btn-blue{background:var(--blue);color:#000;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
.btn-full{width:100%;}.btn-sm{padding:5px 10px;font-size:11px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th{text-align:left;padding:9px 10px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border);font-family:monospace;white-space:nowrap;}
td{padding:10px;border-bottom:1px solid rgba(33,38,45,0.6);vertical-align:middle;}
.mono{font-family:monospace;}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;font-family:monospace;font-weight:600;}
.bg{background:rgba(63,185,80,.15);color:var(--green);}
.br{background:rgba(248,81,73,.15);color:var(--red);}
.bo{background:rgba(249,115,22,.15);color:var(--orange);}
.bgold{background:rgba(240,165,0,.15);color:var(--gold);}
.bbl{background:rgba(88,166,255,.15);color:var(--blue);}
.bmu{background:rgba(139,148,158,.15);color:var(--muted);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
@media(max-width:580px){.g2{grid-template-columns:1fr;}.g3{grid-template-columns:1fr 1fr;}}
.ci{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);gap:8px;}
.ci:last-child{border-bottom:none;}
.rr{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.rr:last-child{border-bottom:none;}
.ri{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:rgba(248,81,73,.07);border:1px solid rgba(248,81,73,.2);border-radius:7px;margin-bottom:7px;}
.div{border:none;border-top:1px solid var(--border);margin:14px 0;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;top:14px;right:14px;z-index:9999;padding:11px 16px;border-radius:8px;font-size:12px;font-family:monospace;box-shadow:0 4px 20px rgba(0,0,0,.5);max-width:300px;}
@keyframes fi{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.low-row td{background:rgba(248,81,73,.04);}
/* Invoice */
@media print{.no-print{display:none!important;}.inv-wrap{position:static!important;background:#fff!important;padding:0!important;}}
.inv-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;overflow-y:auto;z-index:1000;padding:20px;}
.inv-doc{background:#fff;color:#000;padding:28px;width:100%;max-width:580px;font-family:Georgia,serif;box-shadow:0 8px 40px rgba(0,0,0,.5);margin-top:60px;}
.inv-hdr{text-align:center;border-bottom:2px solid #000;padding-bottom:14px;margin-bottom:14px;}
.inv-name{font-size:20px;font-weight:700;letter-spacing:1px;}
.inv-det{font-size:11px;color:#444;margin-top:3px;}
.inv-title{font-size:15px;font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:2px;margin:12px 0 8px;}
.inv-meta{display:flex;justify-content:space-between;font-size:11px;color:#333;margin-bottom:14px;}
.inv-tbl{width:100%;border-collapse:collapse;margin-bottom:14px;}
.inv-tbl th{background:#f0f0f0;padding:7px 9px;font-size:10px;text-align:left;border:1px solid #ddd;text-transform:uppercase;}
.inv-tbl td{padding:7px 9px;font-size:12px;border:1px solid #ddd;}
.inv-tbl tr:nth-child(even) td{background:#fafafa;}
.inv-tot{border-top:2px solid #000;padding-top:10px;}
.inv-tot-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px;}
.inv-grand{font-size:17px;font-weight:700;border-top:1px solid #000;margin-top:6px;padding-top:6px;}
.inv-paid{text-align:center;margin:14px 0;}
.inv-paid span{display:inline-block;border:3px solid #3FB950;color:#3FB950;padding:6px 20px;border-radius:4px;font-size:18px;font-weight:700;letter-spacing:3px;transform:rotate(-5deg);}
.inv-foot{text-align:center;font-size:10px;color:#666;margin-top:16px;border-top:1px solid #ddd;padding-top:10px;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ── CONFIG ────────────────────────────────────────────────────────────────────
const STORE = {
  name:    "LITTLE SKY HOME SUPPLIES",
  tagline: "Your Trusted Home & Hardware Specialists",
  address: "In front Nyaniba Hotel, Off Cape Coast-Accra Highway, Yamoransa",
  phone:   "0241537176",
};
const GAS_URL = "https://script.google.com/macros/s/AKfycbyvacMwcijQ959iuYVBvgYy01_swTlsoHVLd3lAoLekYWJbAob1ABpU9VV7aaX5zEP0WQ/exec";
const OWNER_PW = "littlesky2026";
const LS_KEY   = "lsky_v1";

// ── REACT ─────────────────────────────────────────────────────────────────────
const {useState,useEffect,useMemo,useCallback} = React;

// ── HELPERS ───────────────────────────────────────────────────────────────────
const TODAY     = new Date();
const todayStr  = TODAY.toISOString().split("T")[0];
const GHS       = n => `GHS ${(Number(n)||0).toFixed(2)}`;
const uid       = () => Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,5).toUpperCase();
const fmtDate   = d => { try{ return new Date(d).toLocaleDateString("en-GB"); }catch(e){ return d; } };
const fmtTime   = d => { try{ return new Date(d).toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
const fmtDT     = d => `${fmtDate(d)} ${fmtTime(d)}`;
const isMomoM   = m => ["MTN MoMo","Telecel Cash","AT Money"].includes(m);

// ── LOCAL STORAGE ─────────────────────────────────────────────────────────────
function lsLoad(){
  try{ const r=localStorage.getItem(LS_KEY); return r?JSON.parse(r):{products:[],sales:[],items:[],closing:[]}; }
  catch(e){ return {products:[],sales:[],items:[],closing:[]}; }
}
function lsSave(db){ try{ localStorage.setItem(LS_KEY,JSON.stringify(db)); }catch(e){} }

// ── GAS API ───────────────────────────────────────────────────────────────────
function gasGet(){
  return new Promise(resolve=>{
    const cb="cb_"+uid();
    const s=document.createElement("script");
    let done=false;
    window[cb]=d=>{ done=true; try{document.head.removeChild(s);}catch(e){} delete window[cb]; resolve(d); };
    s.src=`${GAS_URL}?action=getAll&callback=${cb}`;
    s.onerror=()=>{ if(!done){done=true;delete window[cb];resolve(null);} };
    document.head.appendChild(s);
    setTimeout(()=>{ if(!done){done=true;delete window[cb];try{document.head.removeChild(s);}catch(e){}resolve(null);} },12000);
  });
}
function gasPost(action,data){
  fetch(GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action,data})}).catch(()=>{});
}

// ── INVOICE COMPONENT ─────────────────────────────────────────────────────────
function Invoice({type,sale,saleItems,products,onClose}){
  const isPaid = type==="receipt";
  const no     = isPaid?`RCP-${sale.id}`:`INV-${Date.now().toString(36).toUpperCase()}`;
  const getP   = id => products.find(p=>String(p.id)===String(id));
  const total  = saleItems.reduce((s,i)=>s+Number(i.quantity)*Number(i.price_at_sale),0);

  return (
    <div className="inv-wrap">
      <div className="no-print" style={{position:"fixed",top:14,right:14,display:"flex",gap:8,zIndex:1001}}>
        <button className="btn btn-gold" onClick={()=>window.print()}>🖨 Print</button>
        <button className="btn btn-ghost" onClick={onClose}>✕ Close</button>
      </div>
      <div className="inv-doc">
        <div className="inv-hdr">
          <div className="inv-name">{STORE.name}</div>
          <div className="inv-det">{STORE.tagline}</div>
          <div className="inv-det">{STORE.address}</div>
          <div className="inv-det">📞 {STORE.phone}</div>
        </div>
        <div className="inv-title">{isPaid?"Official Receipt":"Invoice / Proforma"}</div>
        <div className="inv-meta">
          <div>
            <div><strong>No:</strong> {no}</div>
            <div><strong>Date:</strong> {fmtDate(sale.timestamp||new Date())}</div>
            {isPaid&&<div><strong>Time:</strong> {fmtTime(sale.timestamp||new Date())}</div>}
          </div>
          <div style={{textAlign:"right"}}>
            {isPaid&&<div><strong>Attendant:</strong> {sale.attendant_name}</div>}
            {isPaid&&<div><strong>Payment:</strong> {sale.payment_method}</div>}
            {isPaid&&sale.momo_reference&&<div><strong>Ref:</strong> {sale.momo_reference}</div>}
          </div>
        </div>
        <table className="inv-tbl">
          <thead><tr><th>#</th><th>Description</th><th style={{textAlign:"right"}}>Qty</th><th style={{textAlign:"right"}}>Unit Price</th><th style={{textAlign:"right"}}>Total</th></tr></thead>
          <tbody>
            {saleItems.map((item,i)=>{
              const p=getP(item.product_id);
              const name=p?p.name:item.product_name||`Item ${i+1}`;
              const qty=Number(item.quantity)||0;
              const price=Number(item.price_at_sale)||0;
              return <tr key={i}>
                <td style={{color:"#666"}}>{i+1}</td>
                <td>{name}</td>
                <td style={{textAlign:"right",fontFamily:"monospace"}}>{qty}</td>
                <td style={{textAlign:"right",fontFamily:"monospace"}}>GHS {price.toFixed(2)}</td>
                <td style={{textAlign:"right",fontFamily:"monospace",fontWeight:600}}>GHS {(qty*price).toFixed(2)}</td>
              </tr>;
            })}
          </tbody>
        </table>
        <div className="inv-tot">
          <div className="inv-tot-row inv-grand"><span>TOTAL</span><span style={{fontFamily:"monospace"}}>{GHS(total)}</span></div>
        </div>
        {isPaid&&<div className="inv-paid"><span>PAID</span></div>}
        <div className="inv-foot">
          {isPaid?"Thank you for your business! Please keep this receipt.":"This invoice is valid for 7 days."}<br/>
          {STORE.name} — {STORE.phone}<br/>
          <small>Software by Yafia Consulting</small>
        </div>
      </div>
    </div>
  );
}

// ── SPINNER ───────────────────────────────────────────────────────────────────
function Spinner({msg="Loading..."}){
  return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"60px",gap:14}}>
    <div style={{width:32,height:32,border:"3px solid var(--border)",borderTopColor:"var(--gold)",borderRadius:"50%",animation:"sp .8s linear infinite"}}/>
    <div style={{color:"var(--muted)",fontSize:12,fontFamily:"monospace"}}>{msg}</div>
  </div>;
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  // Role & navigation
  const [role,setRole]     = useState(null);  // null | "owner" | "attendant"
  const [tab,setTab]       = useState("pos");
  const [loading,setLoading] = useState(false);
  const [syncing,setSyncing] = useState(false);
  const [toast,setToast]   = useState(null);

  // Data
  const [products,setProducts]   = useState([]);
  const [sales,setSales]         = useState([]);
  const [saleItems,setSaleItems] = useState([]);
  const [closing,setClosing]     = useState([]);

  // POS
  const [cart,setCart]         = useState([]);
  const [selProd,setSelProd]   = useState("");
  const [selQty,setSelQty]     = useState(1);
  const [attendant,setAttendant] = useState("");
  const [payMethod,setPayMethod] = useState("");
  const [momoRef,setMomoRef]   = useState("");

  // Invoice/Receipt modal
  const [invoice,setInvoice]   = useState(null); // {type, sale, items}

  // Inventory forms
  const [np,setNp] = useState({name:"",unit:"pcs",cost_price:"",selling_price:"",current_stock:"0",reorder_level:"1"});
  const [rsId,setRsId]   = useState("");
  const [rsQty,setRsQty] = useState("");
  const [rsCost,setRsCost] = useState("");

  // Reconciliation
  const [aCash,setACash]   = useState("");
  const [aMomo,setAMomo]   = useState("");
  const [reconBy,setReconBy] = useState("");
  const [reconRes,setReconRes] = useState(null);

  // Password modal
  const [showPw,setShowPw] = useState(false);
  const [pwVal,setPwVal]   = useState("");
  const [pwErr,setPwErr]   = useState("");

  // Toast helper
  const showT = (msg,col="var(--green)") => { setToast({msg,col}); setTimeout(()=>setToast(null),3500); };

  // ── Load data ───────────────────────────────────────────────────────────────
  const loadData = useCallback(async()=>{
    setLoading(true);
    // 1. Show cached data immediately
    const cached = lsLoad();
    setProducts(cached.products||[]);
    setSales(cached.sales||[]);
    setSaleItems(cached.items||[]);
    setClosing(cached.closing||[]);
    setLoading(false);
    // 2. Fetch fresh from GAS in background
    try {
      const fresh = await gasGet();
      if(fresh && Array.isArray(fresh.products)){
        const db = {
          products: fresh.products||[],
          sales:    fresh.sales||[],
          items:    fresh.salesitems||[],
          closing:  fresh.closing||[]
        };
        lsSave(db);
        setProducts(db.products);
        setSales(db.sales);
        setSaleItems(db.items);
        setClosing(db.closing);
      }
    } catch(e){}
  },[]);

  useEffect(()=>{ loadData(); },[]);

  // ── Derived values ──────────────────────────────────────────────────────────
  const isOwner     = role==="owner";
  const cartTotal   = cart.reduce((s,i)=>s+i.total,0);
  const lowStock    = products.filter(p=>Number(p.current_stock)<=Number(p.reorder_level));
  const stockVal    = products.reduce((s,p)=>s+Number(p.current_stock)*Number(p.cost_price),0);
  const todaySales  = sales.filter(s=>s.timestamp&&String(s.timestamp).startsWith(todayStr));
  const todayCash   = todaySales.filter(s=>s.payment_method==="Cash").reduce((s,x)=>s+Number(x.total_amount),0);
  const todayMomo   = todaySales.filter(s=>s.payment_method!=="Cash").reduce((s,x)=>s+Number(x.total_amount),0);
  const todayClosed = closing.find(c=>c.date===todayStr);

  // ── POS: Add to cart ────────────────────────────────────────────────────────
  const addToCart = () => {
    const p = products.find(x=>String(x.id)===String(selProd));
    if(!p){ showT("Select a product","var(--red)"); return; }
    const qty = Number(selQty);
    if(!qty||qty<1){ showT("Enter valid quantity","var(--red)"); return; }
    const inCart = cart.find(i=>String(i.pid)===String(selProd));
    const already = inCart?inCart.qty:0;
    if(already+qty>Number(p.current_stock)){ showT(`Only ${p.current_stock} in stock`,"var(--red)"); return; }
    if(inCart){
      setCart(prev=>prev.map(i=>String(i.pid)===String(selProd)?{...i,qty:i.qty+qty,total:(i.qty+qty)*i.price}:i));
    } else {
      setCart(prev=>[...prev,{pid:p.id,name:p.name,qty,price:Number(p.selling_price),total:qty*Number(p.selling_price)}]);
    }
    setSelQty(1);
  };

  // ── POS: Generate invoice (before payment) ──────────────────────────────────
  const genInvoice = () => {
    if(cart.length===0){ showT("Cart is empty","var(--red)"); return; }
    setInvoice({
      type:"invoice",
      sale:{timestamp:new Date().toISOString(),attendant_name:attendant||"—",payment_method:"—",momo_reference:""},
      items:cart.map(i=>({product_id:i.pid,product_name:i.name,quantity:i.qty,price_at_sale:i.price}))
    });
  };

  // ── POS: Complete sale ──────────────────────────────────────────────────────
  const completeSale = async() => {
    if(cart.length===0){ showT("Cart is empty","var(--red)"); return; }
    if(!attendant.trim()){ showT("Enter attendant name","var(--red)"); return; }
    if(!payMethod){ showT("Select payment method","var(--red)"); return; }
    if(isMomoM(payMethod)&&!momoRef.trim()){ showT("MoMo Transaction ID required","var(--red)"); return; }

    setSyncing(true);
    const saleId  = uid();
    const now     = new Date().toISOString();
    const saleRow = {id:saleId,timestamp:now,total_amount:cartTotal,payment_method:payMethod,momo_reference:momoRef||"",attendant_name:attendant};
    const itemRows = cart.map(i=>({id:uid(),sale_id:saleId,product_id:i.pid,quantity:i.qty,price_at_sale:i.price}));

    // Update local state immediately
    const db = lsLoad();
    db.sales.push(saleRow);
    itemRows.forEach(ir=>db.items.push(ir));
    db.products = db.products.map(p=>{
      const ci = cart.find(i=>String(i.pid)===String(p.id));
      return ci?{...p,current_stock:Number(p.current_stock)-ci.qty}:p;
    });
    lsSave(db);
    setProducts(db.products);
    setSales(db.sales);
    setSaleItems(db.items);

    // Fire to GAS in background
    gasPost("saveSale",saleRow);
    itemRows.forEach(ir=>gasPost("saveSaleItem",ir));
    cart.forEach(i=>{
      const p=products.find(x=>String(x.id)===String(i.pid));
      if(p) gasPost("updateProduct",{id:i.pid,updates:{current_stock:Number(p.current_stock)-i.qty}});
    });

    // Show receipt
    setInvoice({type:"receipt",sale:saleRow,items:itemRows});
    setCart([]); setPayMethod(""); setMomoRef(""); setAttendant("");
    setSyncing(false);
    showT("✓ Sale completed!");
  };

  // ── Inventory: Add product ──────────────────────────────────────────────────
  const addProduct = async() => {
    if(!np.name.trim()||!np.selling_price){ showT("Name and selling price required","var(--red)"); return; }
    setSyncing(true);
    const row = {id:uid(),name:np.name.trim(),unit:np.unit||"pcs",cost_price:Number(np.cost_price)||0,selling_price:Number(np.selling_price)||0,current_stock:Number(np.current_stock)||0,reorder_level:Number(np.reorder_level)||1};
    const db=lsLoad(); db.products.push(row); lsSave(db);
    setProducts(p=>[...p,row]);
    gasPost("saveProduct",row);
    setNp({name:"",unit:"pcs",cost_price:"",selling_price:"",current_stock:"0",reorder_level:"1"});
    setSyncing(false);
    showT("✓ Product added");
  };

  // ── Inventory: Restock ──────────────────────────────────────────────────────
  const restock = async() => {
    if(!rsId||!rsQty){ showT("Select product and enter quantity","var(--red)"); return; }
    const p=products.find(x=>String(x.id)===String(rsId));
    if(!p){ showT("Product not found","var(--red)"); return; }
    setSyncing(true);
    const newStock=Number(p.current_stock)+Number(rsQty);
    const updates={current_stock:newStock};
    if(rsCost) updates.cost_price=Number(rsCost);
    const db=lsLoad(); db.products=db.products.map(x=>String(x.id)===String(rsId)?{...x,...updates}:x); lsSave(db);
    setProducts(prev=>prev.map(x=>String(x.id)===String(rsId)?{...x,...updates}:x));
    gasPost("updateProduct",{id:rsId,updates});
    setRsId(""); setRsQty(""); setRsCost("");
    setSyncing(false);

    const db=lsLoad(); db.closing.push(row); lsSave(db);
    setClosing(prev=>[...prev,row]);
    gasPost("saveClosing",row);
    setReconRes(row); setACash(""); setAMomo(""); setReconBy("");
    setSyncing(false);

                </select>

              <button className="btn btn-red btn-sm" onClick={()=>setCart([])}>🗑</button>
            </div>

                <div className="fg"><label>Selling Price *</label><input type="number" value={np.selling_price} onChange={e=>setNp(p=>({...p,selling_price:e.target.value}))} placeholder="0.00"/></div>

              <div className="g2">
                <div className="fg"><label>Opening Stock</label><input type="number" value={np.current_stock} onChange={e=>setNp(p=>({...p,current_stock:e.target.value}))}/></div>

              <button className="btn btn-green btn-full" onClick={restock} disabled={syncing}>{syncing?"Saving...":"+ Add Stock"}</button>

                    return <tr key={s.id}>
                      <td className="mono" style={{fontSize:10}}>{fmtDT(s.timestamp)}</td>
                      <td>{s.attendant_name}</td>
                      <td><span className={`badge ${s.payment_method==="Cash"?"bg":s.payment_method.includes("MTN")?"bgold":"bbl"}`}>{s.payment_method}</span></td>
                      <td className="mono" style={{fontSize:10,color:"var(--muted)"}}>{s.momo_reference||"—"}</td>
                      <td className="mono" style={{color:"var(--gold)",fontWeight:700}}>{GHS(s.total_amount)}</td>
                      <td><button className="btn btn-ghost btn-sm" onClick={()=>setInvoice({type:"receipt",sale:s,items:si})}>🧾</button></td>
                    </tr>;
                  })}
                  {sales.length===0&&<tr><td colSpan={6} style={{textAlign:"center",color:"var(--muted)",padding:20}}>No sales yet.</td></tr>}
                </tbody>
              </table>
            </div>
          </div>
          {closing.length>0&&<div className="card">
            <div className="ctitle">End of Day History</div>
            <div style={{overflowX:"auto"}}>
              <table>
                <thead><tr><th>Date</th><th>Exp Cash</th><th>Act Cash</th><th>Exp MoMo</th><th>Act MoMo</th><th>Status</th><th>By</th></tr></thead>
                <tbody>{[...closing].reverse().map(c=>(
                  <tr key={c.id}>
                    <td className="mono">{c.date}</td>
                    <td className="mono">{GHS(c.expected_cash)}</td>
                    <td className="mono">{GHS(c.actual_cash)}</td>
                    <td className="mono">{GHS(c.expected_momo)}</td>
                    <td className="mono">{GHS(c.actual_momo)}</td>
                    <td><span className={`badge ${c.status==="Matched"?"bg":"br"}`}>{c.status}</span></td>
                    <td>{c.closed_by}</td>
                  </tr>
                ))}</tbody>
              </table>
            </div>
          </div>}
        </>}

      </div>}
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById("root"));
</script>
</body>
</html>
